<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stavební & Rekonstrukční Práce</title>
    <!-- FontAwesome pro ikony -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-card: rgba(255, 255, 255, 0.1);
            --transition: all 0.3s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        section {
            margin-bottom: 4rem;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        /* Sekce Projektů / Referencí */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
        }

        .project-card {
            background: var(--card-bg);
            border: 1px solid var(--border-card);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .project-title {
            font-size: 1.25rem;
            margin-bottom: 0.5rem;
        }

        .project-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .btn-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid var(--border-card);
            padding: 0.6rem 1.2rem;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
            width: fit-content;
        }

        .btn-link:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        .main-cta-container {
            text-align: center;
            margin-top: 2.5rem;
        }

        .btn-main-portfolio {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            border: 1px solid var(--accent-blue);
            padding: 0.9rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: var(--transition);
        }

        .btn-main-portfolio:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.25);
        }

        /* Kontaktní formulář */
        .contact-section {
            max-width: 600px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 16px;
            border: 1px solid var(--border-card);
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.4rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-card);
            background: rgba(15, 23, 42, 0.6);
            color: white;
            font-size: 1rem;
            outline: none;
        }

        .form-control:focus {
            border-color: var(--accent-blue);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            border: none;
            border-radius: 8px;
            background: var(--accent-blue);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        .btn-submit:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        #form-status {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- SEKCE REALIZOVANÝCH PROJEKTŮ -->
    <section>
        <h2>Naše realizace</h2>
        
        <div class="projects-grid">
            <!-- Dlaždice Podbaba -->
            <div class="project-card">
                <div>
                    <h3 class="project-title">Rekonstrukce bytu Podbaba</h3>
                    <p class="project-desc">Kompletní rekonstrukce bytového jádra, nové rozvody, obklady a finální designové úpravy na míru.</p>
                </div>
                
                <div class="case-study-actions">
                    <a href="projekty/podbaba.html" class="btn-link">
                        Detail projektu & fotogalerie <i class="fa-solid fa-arrow-right"></i>
                    </a>
                </div>
            </div>

            <!-- Prostor pro další projekt do budoucna -->
            <div class="project-card" style="opacity: 0.5;">
                <div>
                    <h3 class="project-title">Připravujeme další projekt</h3>
                    <p class="project-desc">Další ukázka naší práce bude přidána již brzy.</p>
                </div>
            </div>
        </div>

        <!-- Tlačítko na kompletní podstránku -->
        <div class="main-cta-container">
            <a href="projekty.html" class="btn-main-portfolio">
                <i class="fa-solid fa-images" style="color: var(--accent-blue);"></i> Zobrazit všechny realizované projekty
            </a>
        </div>
    </section>


    <!-- SEKCE KONTAKTNÍHO FORMULÁŘE -->
    <section class="contact-section">
        <h2>Napište nám</h2>

        <form id="contact-form">
            <div class="form-group">
                <label for="name">Jméno a příjmení</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="Jan Novák" required>
            </div>

            <div class="form-group">
                <label for="email">E-mailová adresa</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="jan.novak@email.cz" required>
            </div>

            <div class="form-group">
                <label for="message">Vaše zpráva / Poptávka</label>
                <textarea id="message" name="message" class="form-control" placeholder="Popište, s čím potřebujete pomoct..." required></textarea>
            </div>

            <button type="submit" id="submit-btn" class="btn-submit">Odeslat odpověď</button>
        </form>

        <div id="form-status"></div>
    </section>

</div>

<!-- JAVASCRIPT PRO AJAX ODESÍLÁNÍ -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('contact-form');
    const submitBtn = document.getElementById('submit-btn');
    const formStatus = document.getElementById('form-status');

    form.addEventListener('submit', async function(e) {
        // Zamezí klasickému přesměrování stránky
        e.preventDefault();

        // Uložení původního textu a úprava tlačítka na stav načítání
        const originalText = submitBtn.innerText;
        submitBtn.innerText = 'Odesílám...';
        submitBtn.disabled = true;
        formStatus.innerHTML = '';

        const formData = new FormData(form);

        try {
            // !!! NAHRAĎ NÍŽE E-MAIL ZA SVŮJ REÁLNÝ E-MAIL !!!
            const response = await fetch('https://formsubmit.co/ajax/jopis@jopis.cz', {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            });

            if (response.ok) {
                // Úspěšné odeslání – tlačítko zezelená a změní text
                submitBtn.innerText = 'Odpověď úspěšně odeslána';
                submitBtn.style.backgroundColor = 'var(--accent-green)';
                submitBtn.style.color = '#ffffff';
                form.reset();
            } else {
                throw new Error('Odeslání selhalo');
            }
        } catch (error) {
            // Obnovení tlačítka při chybě
            submitBtn.innerText = originalText;
            submitBtn.disabled = false;
            formStatus.innerHTML = '<span style="color: #ef4444;">Chyba při odesílání. Zkuste to prosím znovu.</span>';
        }
    });
});
</script>

</body>
</html>
